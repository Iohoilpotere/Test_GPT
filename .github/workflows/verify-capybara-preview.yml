name: Verify deployed Capybara preview
on:
  push:
    branches: [work]
    paths:
      - .github/workflows/verify-capybara-preview.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-public:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify the live page and every referenced resource
        run: |
          node --input-type=module <<'JS'
          import { readFile } from 'node:fs/promises';
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          const url='https://scaled-zenith-6m4mvj5.shipstatic.com/';
          const movie='https://upload.wikimedia.org/wikipedia/commons/b/b1/Baby_Capybara_Twins.webm';
          let expected=await readFile('public/capybara/index.html','utf8');
          expected=expected.replace('./media/capybara-twins.webm',movie)
            .replace(/\s*<link rel="canonical"[^>]*>/g,'')
            .replace(/\s*<meta property="og:(url|image)"[^>]*>/g,'')
            .replace('Immagini e video sono ospitati su questo sito.','Le immagini sono ospitate su questo sito; il video viene caricato da Wikimedia Commons soltanto quando premi play.');
          const page=await fetch(url,{signal:AbortSignal.timeout(30000)});
          console.log('PUBLIC_HTTP',page.status,'CONTENT_TYPE',page.headers.get('content-type'));
          assert.equal(page.status,200);
          const actual=await page.text();
          const normalized=actual.replaceAll('?_ship=6m4mvj5','');
          assert.equal(normalized,expected,'Public content differs after observed cache-buster normalization');
          console.log('PUBLIC_HTML_OK expected complete website is online');
          const files=['app.js','styles.css','favicon.svg','media/hero.jpg','media/family.jpg','media/swim.jpg','media/rest.jpg','media/portrait.jpg','media/video-poster.jpg'];
          for(const file of files){
            const response=await fetch(new URL(file+'?_ship=6m4mvj5',url),{signal:AbortSignal.timeout(30000)});
            assert.equal(response.status,200,file);
            const data=Buffer.from(await response.arrayBuffer());
            if(file.endsWith('.jpg')){
              assert.ok((response.headers.get('content-type')||'').includes('image/jpeg'));
              assert.ok(data.length>10000 && data[0]===255 && data[1]===216);
            }else{
              assert.ok(data.equals(await readFile('public/capybara/'+file)),'Unexpected asset content: '+file);
            }
            console.log('PUBLIC_ASSET_OK',file,response.status,data.length,createHash('sha256').update(data).digest('hex'));
          }
          const video=await fetch(movie,{headers:{Range:'bytes=0-63'},signal:AbortSignal.timeout(30000)});
          assert.ok(video.status===200||video.status===206);
          assert.ok((video.headers.get('content-type')||'').includes('video/webm'));
          const reader=video.body.getReader();const first=await reader.read();await reader.cancel();
          assert.ok(Buffer.from(first.value).subarray(0,4).equals(Buffer.from([26,69,223,163])));
          console.log('PUBLIC_VIDEO_OK',video.status);
          console.log('ALL_PUBLIC_DELIVERY_CHECKS_PASSED');
          console.log('PUBLIC_VERIFIED_URL',url);
          JS
